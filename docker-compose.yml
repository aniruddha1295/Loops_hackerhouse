# Run the all-in-one image locally:  docker compose up -d --build  →  http://localhost:8080
# Every restart reloads fresh demo data.
name: claimsagent

services:
  app:
    build: .
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:8080"
    env_file:
      - path: .env
        required: false
